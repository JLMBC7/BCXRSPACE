<script>
(function(){
"use strict";
const canvas=document.getElementById("stage");
const veil=document.getElementById("veil");
function fail(){ // only built if 3D graphics are unavailable
  const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;color:#F4F1F1;font:600 clamp(22px,5vw,48px)/1.1 Oswald,Arial Narrow,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center";
  d.innerHTML="<span>Bakersfield College<br><b style=\"color:#C8102E;font-weight:600\">Innovation Lab</b></span>";
  document.body.appendChild(d);canvas.style.display="none";veil.classList.add("off");}
if(!window.BABYLON){fail();return;}
const B=BABYLON;

let engine;
try{engine=new B.Engine(canvas,true,{antialias:true,stencil:true,powerPreference:"high-performance"},false);}
catch(e){fail();return;}

const small=Math.min(innerWidth,innerHeight)<700;
const dpr=window.devicePixelRatio||1;
let scaling=1/Math.min(dpr,2);
engine.setHardwareScalingLevel(scaling);
const reduceMotion=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const SPEED=reduceMotion?0.35:1;

/* ---------- palette (linear space, so the screen shows true Renegade red) ---------- */
const RED=B.Color3.FromHexString("#C8102E").toLinearSpace();
const CRIMSON=B.Color3.FromHexString("#7A0A1C").toLinearSpace();
function lin(r,g,b,a){const f=v=>Math.round(255*Math.pow(v/255,2.2));return "rgba("+f(r)+","+f(g)+","+f(b)+","+(a===undefined?1:a)+")";}

const scene=new B.Scene(engine);
scene.clearColor=new B.Color4(0.004,0.001,0.002,1);
scene.ambientColor=new B.Color3(0,0,0);
scene.fogMode=B.Scene.FOGMODE_EXP2;
scene.fogColor=new B.Color3(0.018,0.002,0.004);
scene.fogDensity=0.018;

/* ---------- camera ---------- */
const TARGET=new B.Vector3(0,3.4,0);
const cam=new B.ArcRotateCamera("cam",-Math.PI/2,1.4,24,TARGET.clone(),scene);
cam.fov=0.72;cam.minZ=0.1;cam.maxZ=900;
let fitRadius=24;
function fit(){
  const aspect=engine.getRenderWidth()/engine.getRenderHeight();
  const hHalf=Math.atan(Math.tan(cam.fov/2)*aspect);
  fitRadius=Math.max(16,7.0/Math.tan(hHalf));
  scene.fogDensity=0.018*Math.min(1,24/fitRadius);
}
fit();

/* ---------- helpers ---------- */
function dyn(name,w,h,draw,mips){
  const t=new B.DynamicTexture(name,{width:w,height:h},scene,!!mips);
  const c=t.getContext();draw(c,w,h);t.update();
  t.wrapU=B.Texture.WRAP_ADDRESSMODE;t.wrapV=B.Texture.CLAMP_ADDRESSMODE;
  return t;
}
function glowMat(name,tex,level){
  const m=new B.StandardMaterial(name,scene);
  m.disableLighting=true;
  m.diffuseColor=new B.Color3(1,1,1);
  m.emissiveColor=new B.Color3(1,1,1);
  m.diffuseTexture=tex;tex.level=level;
  m.alpha=0.999;m.alphaMode=B.Engine.ALPHA_ADD;
  m.disableDepthWrite=true;m.backFaceCulling=false;m.fogEnabled=false;
  return m;
}

/* ---------- sky dome ---------- */
B.Effect.ShadersStore.skyVertexShader=`
precision highp float;
attribute vec3 position;
uniform mat4 worldViewProjection;
varying vec3 vDir;
void main(){vDir=position;gl_Position=worldViewProjection*vec4(position,1.0);}`;
B.Effect.ShadersStore.skyFragmentShader=`
precision highp float;
varying vec3 vDir;
uniform float time;
float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
void main(){
  vec3 d=normalize(vDir);
  float h=d.y;
  vec3 top=vec3(0.0015,0.0003,0.0006);
  vec3 hor=vec3(0.075,0.0018,0.0055);
  vec3 c=mix(top,hor,exp(-abs(h)*6.0));
  float f=pow(max(dot(d,normalize(vec3(0.0,0.06,1.0))),0.0),10.0);
  c+=vec3(0.30,0.006,0.02)*f;
  vec3 g=floor(d*260.0);
  float s=step(0.9965,hash(g))*smoothstep(0.05,0.4,h);
  c+=vec3(0.9,0.75,0.78)*s*(0.5+0.5*sin(time*2.0+hash(g+3.0)*40.0))*0.6;
  gl_FragColor=vec4(c,1.0);
}`;
const sky=B.MeshBuilder.CreateSphere("sky",{diameter:700,segments:24,sideOrientation:B.Mesh.BACKSIDE},scene);
const skyMat=new B.ShaderMaterial("skyMat",scene,{vertex:"sky",fragment:"sky"},{attributes:["position"],uniforms:["worldViewProjection","time"]});
skyMat.backFaceCulling=false;
sky.material=skyMat;sky.applyFog=false;sky.isPickable=false;

/* ---------- logo (parsed straight from the GLB) ---------- */
function parseGLB(b64){
  const bin=atob(b64);const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const buf=u8.buffer;const dv=new DataView(buf);
  const jsonLen=dv.getUint32(12,true);
  const json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jsonLen)));
  const binStart=20+jsonLen+8;
  const prim=json.meshes[0].primitives[0];
  const read=idx=>{
    const a=json.accessors[idx];const bv=json.bufferViews[a.bufferView];
    const off=binStart+(bv.byteOffset||0)+(a.byteOffset||0);
    const n=a.count*({SCALAR:1,VEC2:2,VEC3:3,VEC4:4})[a.type];
    const C=({5126:Float32Array,5125:Uint32Array,5123:Uint16Array,5121:Uint8Array})[a.componentType];
    return new C(buf.slice(off,off+n*C.BYTES_PER_ELEMENT));
  };
  return {pos:read(prim.attributes.POSITION),nor:read(prim.attributes.NORMAL),idx:read(prim.indices)};
}
const g=parseGLB(window.LOGO_B64);
let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,minT=1e9,maxT=-1e9;
for(let i=0;i<g.pos.length;i+=3){
  const x=g.pos[i],up=-g.pos[i+2],t=g.pos[i+1];
  if(x<minX)minX=x;if(x>maxX)maxX=x;if(up<minY)minY=up;if(up>maxY)maxY=up;if(t<minT)minT=t;if(t>maxT)maxT=t;
}
const LOGO_W=12;
const s=LOGO_W/(maxX-minX),cx=(minX+maxX)/2,cy=(minY+maxY)/2,ct=(minT+maxT)/2;
const LOGO_H=(maxY-minY)*s;
const P=new Float32Array(g.pos.length),N=new Float32Array(g.nor.length);
for(let i=0;i<g.pos.length;i+=3){
  // glTF top view (x right, -z up, +y toward viewer)  ->  Babylon (x right, y up, -z toward camera)
  P[i]=(g.pos[i]-cx)*s;P[i+1]=(-g.pos[i+2]-cy)*s;P[i+2]=-(g.pos[i+1]-ct)*s;
  N[i]=g.nor[i];N[i+1]=-g.nor[i+2];N[i+2]=-g.nor[i+1];
}
// split the extrusion into faces (black) and side walls (red), and trace the front outline
const faceIdx=[],wallIdx=[],edgeMap=new Map();
let zFront=Infinity;
for(let i=2;i<P.length;i+=3)if(P[i]<zFront)zFront=P[i];
const vkey=(i)=>Math.round(P[i*3]*2e4)+","+Math.round(P[i*3+1]*2e4);
for(let t=0;t<g.idx.length;t+=3){
  const a=g.idx[t],b=g.idx[t+1],c=g.idx[t+2];
  const ux=P[b*3]-P[a*3],uy=P[b*3+1]-P[a*3+1],uz=P[b*3+2]-P[a*3+2];
  const vx=P[c*3]-P[a*3],vy=P[c*3+1]-P[a*3+1],vz=P[c*3+2]-P[a*3+2];
  const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
  const len=Math.hypot(nx,ny,nz)||1;
  if(Math.abs(nz/len)>0.9){
    faceIdx.push(a,b,c);
    if((P[a*3+2]+P[b*3+2]+P[c*3+2])/3<0){
      [[a,b,c],[b,c,a],[c,a,b]].forEach(([p,q,r])=>{
        const kp=vkey(p),kq=vkey(q);if(kp===kq)return;
        const k=kp<kq?kp+"|"+kq:kq+"|"+kp;
        const e=edgeMap.get(k);
        if(e)e.n++;else edgeMap.set(k,{n:1,p:p,q:q,r:r});
      });
    }
  }else wallIdx.push(a,b,c);
}
function partMesh(name,idx){
  const m=new B.Mesh(name,scene);const v=new B.VertexData();
  v.positions=P;v.normals=N;v.indices=idx;v.applyToMesh(m);return m;
}
const logo=partMesh("logo",faceIdx);
const logoWalls=partMesh("logoWalls",wallIdx);
// outline ribbons: thin flat strips along every outer edge of the front face
const EW=0.032,ez=zFront-0.006,rp=[],ri=[];
// bold black outline: a band on the OUTSIDE of every edge, just behind the red line
const BW=0.075,bz=zFront-0.003,bp=[],bi=[];
edgeMap.forEach(e=>{
  if(e.n!==1)return;
  const ax=P[e.p*3],ay=P[e.p*3+1],bx=P[e.q*3],by=P[e.q*3+1];
  const dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy);if(l<1e-6)return;
  {
    let nx=-dy/l,ny=dx/l;
    const mx=(ax+bx)/2,my=(ay+by)/2;
    if((P[e.r*3]-mx)*nx+(P[e.r*3+1]-my)*ny>0){nx=-nx;ny=-ny;} // point away from the filled side
    const tx=dx/l*BW*0.5,ty=dy/l*BW*0.5,o=bp.length/3;
    bp.push(ax-tx-nx*0.004,ay-ty-ny*0.004,bz, ax-tx+nx*BW,ay-ty+ny*BW,bz, bx+tx+nx*BW,by+ty+ny*BW,bz, bx+tx-nx*0.004,by+ty-ny*0.004,bz);
    bi.push(o,o+1,o+2,o,o+2,o+3);
  }
  const ox=-dy/l*EW/2,oy=dx/l*EW/2,ex=dx/l*EW*0.35,ey=dy/l*EW*0.35;
  const o=rp.length/3;
  rp.push(ax+ox-ex,ay+oy-ey,ez, ax-ox-ex,ay-oy-ey,ez, bx-ox+ex,by-oy+ey,ez, bx+ox+ex,by+oy+ey,ez);
  ri.push(o,o+1,o+2,o,o+2,o+3);
});
const logoEdges=new B.Mesh("logoEdges",scene);
{const v=new B.VertexData();v.positions=rp;v.indices=ri;v.applyToMesh(logoEdges);}
const logoStroke=new B.Mesh("logoStroke",scene);
{const v=new B.VertexData();v.positions=bp;v.indices=bi;v.applyToMesh(logoStroke);}
const strokeMat=new B.StandardMaterial("strokeMat",scene);

  const intro=(now-t0)/1000;
  time+=dt*SPEED;

  // pointer parallax, eased
  px+=(tx-px)*Math.min(1,dt*2.2);py+=(ty-py)*Math.min(1,dt*2.2);

  // camera: dolly in during intro, then a slow cinematic drift
  const dolly=1+0.55*(1-ease3(clamp01(intro/5)));
  cam.alpha=-Math.PI/2+0.12*Math.sin(time*0.1)+px*0.07-0.25*(1-ease3(clamp01(intro/5)));
  cam.beta=1.47+0.025*Math.sin(time*0.16)-py*0.03-0.12*(1-ease3(clamp01(intro/5)));
  cam.radius=fitRadius*dolly*(1+0.035*Math.sin(time*0.13));
  cam.target.set(px*0.4,TARGET.y-0.15+0.15*Math.sin(time*0.2),0);

  // logo rises out of the floor
  const rise=easeBack(clamp01((intro-0.6)/2.6));
  logoRoot.position.y=-3+(TARGET.y+3)*rise+0.1*Math.sin(time*0.8)*clamp01(intro-3);
  logoRoot.rotation.y=0.5*(1-ease3(clamp01((intro-0.6)/3)))+0.015*Math.sin(time*0.33);

  // sun blooms open, pulses
  const sunK=ease3(clamp01((intro-1.4)/2.4));
  const pulse=1+0.04*Math.sin(time*1.3);
  sun.scaling.setAll(Math.max(0.001,sunK*pulse));
  sun.position.x=Math.sin(time*0.07)*1.2;
  rays.exposure=0.2*sunK*(0.9+0.1*Math.sin(time*0.9));

  // rings
  const ringK=ease3(clamp01((intro-1.8)/2.2));
  rings.forEach(r=>{r.rotation.y+=r.metadata.spin*dt*SPEED;r.scaling.setAll(0.4+0.6*ringK);if(r.metadata.glow)r.material.diffuseTexture.level=3.2*ringK;});
  rimRing.material.diffuseTexture.level=2.6*ringK*(0.85+0.15*Math.sin(time*1.1));
  rimRing2.material.diffuseTexture.level=1.8*ringK;
  edgeTex.level=2.4+0.5*Math.sin(time*1.2);
  shardOrbit.rotation.y=0.22*Math.sin(time*0.05);
  shardOrbit.position.y=0.25*Math.sin(time*0.4);
  if(!probeRefreshed&&intro>4.6){probeRefreshed=true;probe.cubeTexture.resetRefreshCounter();}

  // scanner: sweeps across the logo every 8 seconds
  const cyc=(intro-4.2)%8;
  const sweeping=intro>4.2&&cyc<2.4;
  const sp=sweeping?cyc/2.4:0;
  const sx=-LOGO_W/2-1.5+(LOGO_W+3)*(0.5-0.5*Math.cos(Math.PI*sp));
  const env=sweeping?Math.sin(Math.PI*sp):0;
  scan.position.x=sx;scanTex.level=1.6*env;
  scanLight.position.set(sx,logoRoot.position.y,-1.7);scanLight.intensity=12*env;

  // red rim lights breathe
  rimL.intensity=150+40*Math.sin(time*0.7);
  rimR.intensity=110+30*Math.sin(time*0.9+1.3);

  // exposure ramp
  ip.exposure=0.15+0.95*ease3(clamp01(intro/2.5));

  // shader clocks
  const cp=cam.position;
  skyMat.setFloat("time",time);
  gridMat.setFloat("time",time);gridMat.setFloat("introT",intro);gridMat.setVector3("camPos",cp);
  pillarMat.setFloat("time",time);pillarMat.setFloat("introT",intro);pillarMat.setVector3("camPos",cp);
  pillarMat.setColor3("fogColor",scene.fogColor);pillarMat.setFloat("fogDensity",scene.fogDensity);
  probe.position.copyFrom(logoRoot.position);
});

/* ---------- adaptive quality: drop resolution if the device is struggling ---------- */
// one decision after the intro settles, instead of repeated mid-animation resolution jumps
// only steps in on genuinely weak hardware, and never drops below the screen's native 1x resolution
setTimeout(()=>{
  if(engine.getFps()<28&&dpr>1){scaling=1;engine.setHardwareScalingLevel(scaling);}
},6500);

scene.executeWhenReady(()=>{
  t0=performance.now();last=t0;
  embers.start();
  engine.runRenderLoop(()=>scene.render());
  requestAnimationFrame(()=>veil.classList.add("off"));
});
})();
</script>
